<header class="site-header">
  <div class="identity">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <div class="site-subtitle">
      {{ site.author.position }} · {{ site.author.affiliation }}
    </div>
  </div>

  <nav class="site-nav" aria-label="Main navigation">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}" class="{% if page.nav_key == item.key %}active{% endif %}">{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
